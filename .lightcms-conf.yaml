content:
  - name: posts
    type: collection
    label: Posts
    path: content/posts
    filename: "{primary}.md"
    fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: description
        type: textarea
        label: Description
      - name: date
        type: datetime
        required: true
        label: Date
      - name: draft
        type: checkbox
        label: Draft
      - name: body
        type: textarea
        label: Content
    view:
      primary: title
      fields:
        - title
        - date
        - draft
      sort:
        - date
      order: desc
    commit:
      templates:
        create: Add post {title}
        update: Update post {title}
        delete: Delete post {title}
