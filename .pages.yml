content:
  - name: posts
    type: collection
    label: Posts
    path: content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: description
        type: textarea
        label: Description
      - name: date
        type: datetime
        required: true
        label: Date
      - name: draft
        type: checkbox
        label: Draft
      - name: tags
        type: text
        list: true
        label: Tags
      - name: body
        type: textarea
        label: Content
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date]
      order: desc
      layout: list
      default:
        sort: date
        order: desc
    commit:
      templates:
        create: "Add post {title}"
        update: "Update post {title}"
        delete: "Delete post {title}"

  - name: pages
    type: collection
    label: Pages
    path: content/pages
    filename: "{primary}.md"
    fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: description
        type: textarea
        label: Description
      - name: body
        type: textarea
        label: Content
    view:
      primary: title
      fields: [title, description]
      sort: [title]
      layout: list
    commit:
      templates:
        create: "Add page {title}"
        update: "Update page {title}"
        delete: "Delete page {title}"

  - name: devlog
    type: collection
    label: Devlog
    path: content/devlog
    filename: "{primary}.md"
    fields:
      - name: title
        type: text
        required: true
        label: Title
      - name: date
        type: datetime
        required: true
        label: Date
      - name: body
        type: textarea
        label: Content
    view:
      primary: title
      fields: [title, date]
      sort: [date]
      layout: list
    commit:
      templates:
        create: "Add devlog {title}"
        update: "Update devlog {title}"
        delete: "Delete devlog {title}"

media:
  - name: images
    label: Images
    input: content/images
    output: /content/images
    categories: [image]
    rename: safe
    commit:
      templates:
        create: "Add image {filename}"
        delete: "Delete image {filename}"

settings:
  config: true
  cache: true
  commit:
    identity: user
